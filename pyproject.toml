[project]
name = "charles-hull-eda"
version = "0.1.0"
description = "Auditable exploration of daily operational reports"
requires-python = ">=3.13"
dependencies = ["openpyxl>=3.1.5", "pandas>=2.2.3", "plotly>=6", "ipykernel>=6.29.5"]

[dependency-groups]
dev = ["pytest>=8.3.4"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning", "error::FutureWarning"]
